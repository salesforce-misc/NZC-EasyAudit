<!-- NZc Easy Audit Step -->
<template>
    <lightning-accordion-section label={title}>
        <template if:true={recordLinkId}>
            <div class="slds-m-bottom_small">
                <lightning-formatted-url
                    value={recordLinkId}
                    label={recordLinkName}
                ></lightning-formatted-url>
            </div>
        </template>
        <template for:each={lineRows} for:item="row">
            <lightning-tile
                key={row.key}
                type="standard"
                label={row.text}
                class="slds-m-bottom_x-small"
            ></lightning-tile>
        </template>
    </lightning-accordion-section>
</template>
