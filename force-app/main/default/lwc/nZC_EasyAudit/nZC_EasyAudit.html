<!-- NZC_EasyAudit -->
<template>
    <lightning-card class='base-card'>
        <template if:true={showV2}>
            <lightning-accordion class="example-accordion" allow-multiple-sections-open>
            <template for:each={instructions} for:item="instruction" for:index='i'>
                <c-n-z-c_-easy-audit-step key={instruction.title} step-instruction={instruction}></c-n-z-c_-easy-audit-step>
            </template>
            </lightning-accordion>
        </template>
    </lightning-card>
</template>
