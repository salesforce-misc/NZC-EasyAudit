<!-- NZC_EasyAudit -->
<template>
  <lightning-card title="Emissions calculation audit trail">
    <template if:true={hasSteps}>
      <div slot="actions" class="slds-button-group">
        <lightning-button
          label="Export audit"
          variant="neutral"
          disabled={disableExport}
          onclick={handleExportAudit}
          data-id="export-audit"
        ></lightning-button>
        <lightning-button
          label={toggleAllLabel}
          variant="brand-outline"
          onclick={toggleExpandAll}
          data-id="toggle-expand"
        ></lightning-button>
      </div>
    </template>
    <template if:true={showV2}>
      <lightning-accordion
        allow-multiple-sections-open
        active-section-name={activeSectionNames}
      >
        <template for:each={steps} for:item="step">
          <c-n-z-c_-easy-audit-step
            key={step.key}
            section-name={step.sectionName}
            step-instruction={step.instruction}
          ></c-n-z-c_-easy-audit-step>
        </template>
      </lightning-accordion>
      <c-n-z-c_-easy-audit-insights
        instructions={instructions}
        record-id={recordId}
        onsummaryready={handleSummaryReady}
      ></c-n-z-c_-easy-audit-insights>
    </template>
  </lightning-card>
</template>
